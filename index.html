<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATFLIR // MULTI-AXIS // INCIDENT_REPORT</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #222; 
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: none; 
            text-transform: uppercase;
        }

        #viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            filter: contrast(180%) brightness(0.7) grayscale(1);
            transition: filter 2s; /* Used for the blinding flash */
        }

        #noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0.15;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: noise-shift 0.1s infinite;
        }

        @keyframes noise-shift {
            0% { transform: translate(0,0); }
            50% { transform: translate(-5px, 5px); }
            100% { transform: translate(5px, -5px); }
        }

        #hud-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }

        #reticle {
            position: absolute;
            width: 140px; height: 140px;
            border: 1px solid rgba(255,255,255,0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #reticle::before { content: ""; position: absolute; top: 50%; left: -30%; width: 160%; height: 1px; background: #fff; }
        #reticle::after { content: ""; position: absolute; left: 50%; top: -30%; width: 1px; height: 160%; background: #fff; }

        #lock-box {
            position: absolute;
            border: 2px solid #fff;
            width: 65px; height: 65px;
            display: none;
            z-index: 12;
            pointer-events: none;
        }
        #lock-label {
            position: absolute;
            top: -25px; left: 0;
            background: #fff; color: #000;
            font-weight: bold; font-size: 12px;
            padding: 2px 5px;
        }

        #terminal-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 220px;
            background: #000;
            border-top: 3px solid #444;
            z-index: 20;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            transition: opacity 0.5s;
        }

        #terminal-header {
            background: #333;
            padding: 5px 20px;
            font-size: 12px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        #log-output {
            flex-grow: 1;
            padding: 15px 20px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin: 3px 0;
            font-size: 14px;
            color: #ddd;
        }
        .log-line.alert { color: #ff3333; font-weight: bold; }
        .log-line.pilot { color: #55ff55; }
        .log-line.system-fail { color: #ff0000; font-weight: bold; font-size: 16px; background: rgba(255,0,0,0.2); padding: 2px;}

        /* ENDGAME CSS */
        .severe-glitch {
            animation: glitch-anim 0.1s infinite !important;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0,0) skew(0deg); opacity: 1; }
            20% { transform: translate(-5px, 2px) skew(-10deg); opacity: 0.8; filter: invert(1); }
            40% { transform: translate(5px, -2px) skew(10deg); opacity: 1; filter: invert(0); }
            60% { transform: translate(-2px, 5px) skew(0deg); opacity: 0.9; }
            80% { transform: translate(2px, -5px) skew(5deg); opacity: 1; filter: invert(1); }
            100% { transform: translate(0,0) skew(0deg); opacity: 1; filter: invert(0); }
        }

        #dead-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            color: #fff;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #dead-text {
            font-size: 24px;
            letter-spacing: 15px;
            animation: pulse-slow 2s infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

    </style>
</head>
<body>

    <canvas id="viewport"></canvas>
    <div id="noise-overlay"></div>

    <div id="hud-layer">
        <div class="telemetry-row">
            <div>MODE: IR<br>WHT-HOT<br>FIELD: NARR</div>
            <div style="text-align: center;">V_SENSOR<br>AZ: <span id="az-val">000</span><br>EL: <span id="el-val">-12</span>°</div>
            <div>ALT: 25,000<br>SPD: Mach 0.8<br>RNG: 5.4NM</div>
        </div>

        <div id="reticle"></div>
        <div id="lock-box">
            <div id="lock-label">LKD [TRK]</div>
        </div>
    </div>

    <div id="terminal-container">
        <div id="terminal-header">
            <span>SECURE COMMS // MISSION ID: 07-GIMBAL</span>
            <span id="system-status">SYSTEMS: NOMINAL</span>
        </div>
        <div id="log-output"></div>
    </div>

    <div id="dead-screen">
        <div id="dead-text">SIGNAL LOST</div>
        <div style="font-size: 12px; margin-top: 20px; color: #555;">END OF RECORDING</div>
    </div>

    <script>
        const canvas = document.getElementById('viewport');
        const ctx = canvas.getContext('2d');
        const logOutput = document.getElementById('log-output');
        const lockBox = document.getElementById('lock-box');
        const reticle = document.getElementById('reticle');
        const azVal = document.getElementById('az-val');
        const elVal = document.getElementById('el-val');
        const viewport = document.getElementById('viewport');

        let width, height;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let encounterCount = 0; // Tracks the progression to the end game
        let isSystemDead = false;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            reticle.style.left = mouseX + 'px';
            reticle.style.top = mouseY + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            if(isSystemDead) return;
            mouseX = e.clientX;
            mouseY = e.clientY;
            reticle.style.left = mouseX + 'px';
            reticle.style.top = mouseY + 'px';
            
            azVal.innerText = Math.floor((mouseX / width) * 360).toString().padStart(3, '0');
            elVal.innerText = Math.floor(((mouseY / height) * 40) - 20);
        });

        /* --- THE UAP PHENOMENON --- */
        const UAP = {
            x: Math.random() * window.innerWidth,
            y: Math.random() * (window.innerHeight - 300),
            vx: 2,
            vy: 2,
            angle: 0,
            state: 'CRUISE', // CRUISE, LOCKED, ZOOM, ENDGAME
            lockProgress: 0,
            glowRadius: 42, // Dynamically changes during endgame
            targetX: Math.random() * window.innerWidth,
            targetY: Math.random() * (window.innerHeight - 300),
            
            update() {
                if (isSystemDead) return;

                if (this.state === 'CRUISE') {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 10) {
                        this.targetX = Math.random() * width;
                        this.targetY = Math.random() * (height - 250);
                    } else {
                        this.vx += (dx / distance) * 0.5;
                        this.vy += (dy / distance) * 0.5;
                    }

                    this.vx *= 0.96;
                    this.vy *= 0.96;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.angle *= 0.9; 
                } 
                else if (this.state === 'LOCKED') {
                    this.angle += 0.08;
                    this.x += (Math.random() - 0.5) * 8;
                    this.y += (Math.random() - 0.5) * 8;

                    if (this.angle > 1.5) { 
                        // PROGRESSION LOGIC
                        if (encounterCount < 2) {
                            this.state = 'ZOOM';
                            addLog("ALERT: UNKNOWN PROPULSION DETECTED.", "alert");
                            if(encounterCount === 0) addLog("PILOT: Look at that thing! It's rotating!", "pilot");
                            if(encounterCount === 1) addLog("PILOT: It did it again! Are you getting this?", "pilot");
                            encounterCount++;
                        } else {
                            this.state = 'ENDGAME';
                            triggerEndgameSequence();
                        }
                    }
                } 
                else if (this.state === 'ZOOM') {
                    const escapeX = this.x - mouseX;
                    const escapeY = this.y - mouseY;
                    const dist = Math.sqrt(escapeX*escapeX + escapeY*escapeY);
                    
                    this.vx = (escapeX / dist) * 120;
                    this.vy = (escapeY / dist) * 120;

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x > width + 500 || this.x < -500 || this.y > height + 500 || this.y < -500) {
                        this.reset();
                    }
                }
                else if (this.state === 'ENDGAME') {
                    // Drift ominously to the center of the screen
                    this.x += (width/2 - this.x) * 0.02;
                    this.y += ((height/2 - 100) - this.y) * 0.02;
                    
                    // Violent jitter
                    this.x += (Math.random() - 0.5) * 15;
                    this.y += (Math.random() - 0.5) * 15;
                    
                    // Expand the thermal signature to blind the camera
                    this.glowRadius += 2;
                }

                if (this.state === 'CRUISE') {
                    if (this.x < 50 || this.x > width - 50) this.vx *= -1;
                    if (this.y < 50 || this.y > height - 280) this.vy *= -1;
                }
            },

            draw() {
                if (isSystemDead) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Thermal Glow (Uses dynamic radius for endgame blinding)
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.filter = 'blur(10px)';
                ctx.ellipse(0, 0, this.glowRadius, this.glowRadius/2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.fillStyle = '#fff';
                ctx.filter = 'blur(1px)';
                ctx.ellipse(0, 0, 30, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            },

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height - 300);
                this.vx = 0;
                this.vy = 0;
                this.state = 'CRUISE';
                this.angle = 0;
                this.lockProgress = 0;
                this.targetX = Math.random() * width;
                this.targetY = Math.random() * (height - 300);
                addLog("SENSOR: RE-ACQUIRING BORE-SIGHT TARGET...", "normal");
            }
        };

        /* --- ENDGAME SEQUENCE MANAGER --- */
        function triggerEndgameSequence() {
            addLog("WARNING: MASSIVE THERMAL SPIKE DETECTED.", "alert");
            addLog("PILOT: It's not running away this time...", "pilot");
            
            // Step 1: Lock UI in place, start glitching
            setTimeout(() => {
                document.getElementById('hud-layer').classList.add('severe-glitch');
                addLog("SYSTEM ERROR: RADAR ALTIMETER FAULT.", "system-fail");
                addLog("PILOT: My instruments are going crazy! I'm losing fly-by-wire!", "pilot");
            }, 1500);

            // Step 2: Overexposure (Whiteout)
            setTimeout(() => {
                viewport.style.filter = 'contrast(300%) brightness(5) grayscale(1)';
                addLog("CRITICAL: EMP SURGE IMMINENT.", "system-fail");
            }, 3000);

            // Step 3: Total blackout / Death
            setTimeout(() => {
                isSystemDead = true;
                document.getElementById('hud-layer').style.display = 'none';
                document.getElementById('terminal-container').style.display = 'none';
                document.getElementById('noise-overlay').style.display = 'none';
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,width,height);
                document.body.style.cursor = 'auto'; // Bring back mouse

                document.getElementById('dead-screen').style.display = 'flex';
            }, 4500);
        }

        /* --- ENGINE LOOP --- */
        function animate() {
            if(!isSystemDead) {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, width, height);

                UAP.update();
                UAP.draw();

                const dx = UAP.x - mouseX;
                const dy = UAP.y - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 75 && (UAP.state === 'CRUISE' || UAP.state === 'LOCKED')) {
                    lockBox.style.display = 'block';
                    lockBox.style.left = (UAP.x - 32) + 'px';
                    lockBox.style.top = (UAP.y - 32) + 'px';
                    
                    UAP.lockProgress++;
                    if (UAP.lockProgress > 45) { 
                        if (UAP.state === 'CRUISE') {
                            UAP.state = 'LOCKED';
                            addLog("AUTO-TRACK ENGAGED. TARGET LOCKED.", "normal");
                        }
                    }
                } else if (UAP.state !== 'ENDGAME') {
                    lockBox.style.display = 'none';
                    if (UAP.state === 'LOCKED') {
                        UAP.state = 'CRUISE';
                        addLog("TRACK LOST. RE-ACQUIRING...", "normal");
                    }
                    UAP.lockProgress = 0;
                }
            }

            requestAnimationFrame(animate);
        }

        function addLog(text, type) {
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logOutput.appendChild(line);
            
            if (logOutput.childElementCount > 6) {
                logOutput.removeChild(logOutput.firstChild);
            }
        }

        const idleQuotes = [
            "PILOT: Houston, are we tracking any transponders in this sector?",
            "PILOT: It's moving like nothing I've ever seen. No control surfaces.",
            "WSO: I've got a solid track. It's erratic, moving against 120kt winds.",
            "PILOT: This is not a drone. I repeat, not a drone.",
            "HOUSTON: You are clear for data collection. Do not engage.",
            "PILOT: Look at the size of that thing. It's massive."
        ];

        animate();
        addLog("ATFLIR SYSTEM BOOTED. NOISE REDUCTION: ON.", "normal");
        addLog("SCANNING SECTOR 4... TARGET IDENTIFIED.", "normal");

        setInterval(() => {
            if (UAP.state === 'CRUISE' && Math.random() > 0.6) {
                addLog(idleQuotes[Math.floor(Math.random() * idleQuotes.length)], "pilot");
            }
        }, 6000);

    </script>
</body>
</html>
